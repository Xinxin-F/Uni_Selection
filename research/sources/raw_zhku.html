        // ✅ 安全判断：e.target 是否为 DOM 元素
        let temporaryData = {};
        if (event.target && event.target instanceof Element) {
          // 此时 e.target 才可能是 <script>、<link> 等
          const tagName = event.target.tagName?.toLowerCase(); // 使用可选链确保安全
  
          if (tagName === 'script') {
            temporaryData = {
              custom_type: 1,
              custom_name: 'JS 资源加载失败',
              url: event.target.src,
              errMessage: event.message,
              filename: event.filename,
            }
            // console.error('【JS 资源加载失败】', event.target.src);
          } else if (tagName === 'link') {
            temporaryData = {
              custom_type: 1,
              custom_name: 'CSS 资源加载失败',
              url: event.target.href,
              errMessage: event.message,
              filename: event.filename,
            }
            // console.error('【CSS 资源加载失败】', event.target.href);
          } else if (tagName === 'img') {
            temporaryData = {
              custom_type: 1,
              custom_name: '图片资源加载失败',
              url: event.target.src,
              errMessage: event.message,
              filename: event.filename,
            }
            // console.error('【图片资源加载失败】', event.target.src);
          } else {
            temporaryData = {
              custom_type: 1,
              custom_name: '其他资源加载失败',
              url: event.target.src,
              errMessage: event.message,
              filename: event.filename,
            }
            // console.warn('【其他资源加载失败】', tagName, event.target);
          }
        } else {
          temporaryData = {
            custom_type: 1,
            custom_name: 'JS 运行失败',
            errMessage: event.message,
            filename: event.filename,
          }
          // ❌ 这不是资源加载错误，可能是 JS 运行时错误
          // console.warn('【非资源错误】可能是 JS 运行时异常或跨域脚本错误', event.message, event.filename);
        }
        if(!window.$errorEmit) {
          window.errorTemporaryList = [];
          window.errorTemporaryList.push(temporaryData);
        }else {
          window.$errorEmit(temporaryData);
        }
